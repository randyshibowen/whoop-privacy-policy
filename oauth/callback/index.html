<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Cache-Control" content="no-store">
<title>WHOOP Authorization Callback</title>
<style>
body{font:16px/1.55 system-ui,sans-serif;max-width:680px;margin:3rem auto;padding:0 1rem;color:#202124}
code,pre{overflow-wrap:anywhere;background:#f3f4f6;padding:.3rem .5rem;border-radius:5px}
button{padding:.6rem 1rem;cursor:pointer} .notice{color:#8a4100}
</style>
</head>
<body>
<h1>WHOOP authorization callback</h1>
<p>This page is for a personal WHOOP integration. It does not exchange tokens, send information to a server, or load third-party scripts.</p>
<div id="result" role="status">Checking the authorization response…</div>
<script>
(function () {
  "use strict";
  const params = new URLSearchParams(location.search);
  const code = params.get("code");
  const state = params.get("state");
  const error = params.get("error");
  const errorDescription = params.get("error_description");
  // Remove sensitive query parameters from the visible URL immediately.
  if (location.search || location.hash) {
    history.replaceState(null, "", location.pathname);
  }
  const result = document.getElementById("result");
  result.textContent = "";
  function paragraph(value, className) {
    const p = document.createElement("p");
    p.textContent = value;
    if (className) p.className = className;
    result.appendChild(p);
  }
  function value(label, content) {
    const p = document.createElement("p");
    const strong = document.createElement("strong");
    strong.textContent = label + ": ";
    const item = document.createElement("code");
    item.textContent = content;
    p.append(strong, item);
    result.appendChild(p);
  }
  if (error) {
    paragraph("Authorization was not completed.");
    value("Error", error);
    if (errorDescription) value("Details", errorDescription);
  } else if (code && state) {
    paragraph("WHOOP returned an authorization code. This is not an access token.");
    paragraph("Only proceed using your trusted local authorization helper. Verify that the state matches the value generated by that helper.", "notice");
    value("Authorization code", code);
    value("State", state);
    paragraph("Keep these values private. Do not paste them into ChatGPT, Codex, GitHub, or any public location. The code may expire quickly.");
    paragraph("This page cannot complete authorization on its own. Your local helper must verify state and exchange the code with WHOOP securely.");
  } else {
    paragraph("No complete authorization response was received. Open this page through the WHOOP authorization flow, not directly.");
  }
})();
</script>
</body>
</html>
